# The stack.
#
# Profiles are the hybrid boundary made explicit. The default set is everything
# needed to run the pipeline end to end on one box with no third-party account:
# database, storage, orchestrator, API, narration, captions, review UI.
#
#   docker compose up -d                          core only
#   docker compose --profile local-llm up -d      + Ollama
#   docker compose --profile publishing up -d     + self-hosted scheduling
#   docker compose --profile analytics up -d      + Metabase
#
# Anything you would rather buy is switched off in .env instead — a paid slot
# simply stops pointing at the container, which keeps running or is never
# started. Nothing here has to be removed to move a capability off-box.

name: forge

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forge}
      POSTGRES_DB: ${POSTGRES_DB:-forge}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Applied once, on an empty data directory. Migrations after that are
      # yours to run — this is not a migration tool.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    <<: *restart
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-forge}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-forge-secret}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001"   # console, loopback only
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Narration. CPU-only image: on a 4-vCPU box this keeps up with far more than
  # the dozen or so cuts a day the pipeline actually produces.
  kokoro:
    <<: *restart
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8880/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Captions. `base` is the accuracy/speed point that works on CPU; move to
  # small or medium only if the transcripts are visibly wrong.
  whisper:
    <<: *restart
    image: onerahmet/openai-whisper-asr-webservice:latest
    environment:
      ASR_MODEL: ${WHISPER_MODEL:-base}
      ASR_ENGINE: faster_whisper
    volumes:
      - whisper-cache:/root/.cache

  forge-api:
    <<: *restart
    build: ./pipeline
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-forge}:${POSTGRES_PASSWORD:-forge}@postgres:5432/${POSTGRES_DB:-forge}
    volumes:
      # The B-roll library lives here. Download stock once, keep it, and the
      # footage slot stops depending on anyone.
      - media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"

  n8n:
    <<: *restart
    image: n8nio/n8n:latest
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-forge}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-forge}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-forge}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${TIMEZONE:-Asia/Amman}
      TZ: ${TIMEZONE:-Asia/Amman}
      # Without this n8n stores credentials unencrypted and regenerates the key
      # on every restart, invalidating every stored credential.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"

  # The review UI. Points at the same Postgres the pipeline writes, so the
  # morning approval pass edits live rows rather than a synced copy.
  nocodb:
    <<: *restart
    image: nocodb/nocodb:latest
    environment:
      NC_DB: "pg://postgres:5432?u=${POSTGRES_USER:-forge}&p=${POSTGRES_PASSWORD:-forge}&d=${POSTGRES_DB:-forge}"
      NC_PUBLIC_URL: ${NOCODB_PUBLIC_URL:-http://localhost:8080}
    volumes:
      - nocodb-data:/usr/app/data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  caddy:
    <<: *restart
    image: caddy:2-alpine
    environment:
      FORGE_DOMAIN: ${FORGE_DOMAIN:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - forge-api
      - n8n

  # --- optional: local models ------------------------------------------------
  #
  # Worth running for the mechanical work — scoring, tagging, dedupe, metadata —
  # which is most of the call volume and none of the audience-facing quality.
  # Scripting is the one slot where a small local model is audible, so leave
  # LLM_SCRIPT_PROVIDER pointed at an API until you have compared them yourself.
  ollama:
    <<: *restart
    profiles: ["local-llm"]
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    # Uncomment on a box with an NVIDIA GPU; it runs on CPU without this.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # --- optional: self-hosted publishing --------------------------------------
  #
  # Removes the scheduling and token-refresh work. It does NOT remove the need
  # to register your own developer app with each platform and survive review —
  # that cost is structural and no provider avoids it.
  postiz:
    <<: *restart
    profiles: ["publishing"]
    image: ghcr.io/gitroomhq/postiz-app:latest
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-forge}:${POSTGRES_PASSWORD:-forge}@postgres:5432/postiz
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${POSTIZ_JWT_SECRET:-change-me}
      MAIN_URL: ${POSTIZ_URL:-http://localhost:5000}
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      UPLOAD_DIRECTORY: /uploads
    volumes:
      - postiz-uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:5000:5000"

  redis:
    <<: *restart
    profiles: ["publishing"]
    image: redis:7-alpine
    volumes:
      - redis-data:/data

  # --- optional: analytics ---------------------------------------------------
  #
  # Reads the metrics table directly. Retention curves are the signal that
  # should feed idea scoring; view counts on their own mostly are not.
  metabase:
    <<: *restart
    profiles: ["analytics"]
    image: metabase/metabase:latest
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: ${POSTGRES_USER:-forge}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-forge}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres-data:
  minio-data:
  media:
  n8n-data:
  nocodb-data:
  whisper-cache:
  ollama-models:
  postiz-uploads:
  redis-data:
  caddy-data:
  caddy-config:
